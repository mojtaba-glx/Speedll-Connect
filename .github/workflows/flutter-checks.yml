name: Flutter checks

on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/flutter-checks.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/flutter-checks.yml'

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
