name: Windows host checks

on:
  push:
    paths:
      - 'platform/windows/host/**'
      - '.github/workflows/go-host-checks.yml'
  pull_request:
    paths:
      - 'platform/windows/host/**'
      - '.github/workflows/go-host-checks.yml'

jobs:
  vet-and-cross-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/windows/host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go vet ./...
      - run: GOOS=windows GOARCH=amd64 go build -o /tmp/speedll_windows_host.exe .
      - run: go build -o /tmp/speedll_windows_host_linux .
